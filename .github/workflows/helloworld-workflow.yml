name: HelloWorld

on:
  push:

permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install npm packages
        run: npm ci
      - name: Hello World
        uses: ./.github/actions/helloworld
        with:
          example-param: Hello World